<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Placement Prediction</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            color: white;

            background: linear-gradient(
                135deg,
                #071426,
                #0b1f38,
                #071426
            );
        }


        /* =========================
           MAIN CARD
        ========================= */

        .container {

            width: 100%;
            max-width: 500px;

            padding: 45px 35px;

            background: #0d1b2e;

            border: 1px solid #1e3a5f;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(0, 183, 255, 0.08);

            animation: showCard 0.6s ease;
        }


        /* =========================
           HEADING
        ========================= */

        h1 {

            text-align: center;

            font-size: 36px;

            font-weight: bold;

            color: #ffffff;

            margin-bottom: 12px;
        }


        /* Blue Line Under Heading */

        h1::after {

            content: "";

            display: block;

            width: 60px;
            height: 4px;

            margin: 12px auto 20px;

            border-radius: 10px;

            background: #00b7ff;
        }


        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {

            text-align: center;

            color: #9fb3c8;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 32px;
        }


        /* =========================
           FORM
        ========================= */

        form {
            width: 100%;
        }


        /* =========================
           INPUT GROUP
        ========================= */

        .input-group {

            margin-bottom: 20px;
        }


        /* =========================
           LABEL
        ========================= */

        label {

            display: block;

            margin-bottom: 8px;

            color: #c7d6e5;

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================
           INPUT BOX
        ========================= */

        input[type="text"] {

            width: 100%;

            height: 52px;

            padding: 0 15px;

            border: 1px solid #294766;

            border-radius: 10px;

            outline: none;

            background: #091728;

            color: white;

            font-size: 15px;

            transition: 0.3s;
        }


        /* Placeholder */

        input[type="text"]::placeholder {

            color: #607890;
        }


        /* =========================
           INPUT FOCUS
        ========================= */

        input[type="text"]:focus {

            border-color: #00b7ff;

            background: #0b1c30;

            box-shadow:
                0 0 0 3px rgba(0, 183, 255, 0.10),
                0 0 15px rgba(0, 183, 255, 0.10);
        }


        /* =========================
           SUBMIT BUTTON
        ========================= */

        input[type="submit"] {

            width: 100%;

            height: 52px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background: #008cff;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 5px 15px rgba(0, 140, 255, 0.25);
        }


        /* Button Hover */

        input[type="submit"]:hover {

            background: #00a6ff;

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 166, 255, 0.35);
        }


        /* Button Click */

        input[type="submit"]:active {

            transform: scale(0.97);
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            margin-top: 28px;

            padding-top: 20px;

            border-top: 1px solid #1e3a5f;

            text-align: center;

            color: #647b91;

            font-size: 11px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        /* =========================
           ANIMATION
        ========================= */

        @keyframes showCard {

            from {

                opacity: 0;

                transform: translateY(25px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 15px;
            }


            .container {

                padding: 35px 22px;
            }


            h1 {

                font-size: 30px;
            }


            .subtitle {

                font-size: 14px;
            }


            input[type="text"],
            input[type="submit"] {

                height: 50px;
            }
        }

    </style>

</head>


<body>


    <div class="container">


        <!-- Heading -->

        <h1>
            Placement Predictor
        </h1>


        <!-- Subtitle -->

        <p class="subtitle">

            Enter your details to check your placement prediction

        </p>


        <!-- Placement Form -->

        <form action="{% url 'result' %}">

            {% csrf_token %}


            <!-- IQ -->

            <div class="input-group">

                <label for="IQ">
                    IQ
                </label>

                <input
                    type="text"
                    id="IQ"
                    name="IQ"
                    placeholder="Enter your IQ"
                    required
                >

            </div>


            <!-- CGPA -->

            <div class="input-group">

                <label for="CGPA">
                    CGPA
                </label>

                <input
                    type="text"
                    id="CGPA"
                    name="CGPA"
                    placeholder="Enter your CGPA"
                    required
                >

            </div>


            <!-- Profile -->

            <div class="input-group">

                <label for="PROFILE">
                    Profile
                </label>

                <input
                    type="text"
                    id="PROFILE"
                    name="PROFILE"
                    placeholder="Enter your profile"
                    required
                >

            </div>


            <!-- Submit Button -->

            <input
                type="submit"
                value="Predict Placement"
            >

        </form>


        <!-- Footer -->

        <div class="footer">

            AI Based Student Placement Prediction

        </div>


    </div>


</body>

</html>
