<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071426, #0b1f38, #071426);
            color: white;
        }

        /* Main Card */
        .container {
            width: 90%;
            max-width: 430px;
            padding: 45px 35px;
            text-align: center;

            background: #0d1b2e;
            border: 1px solid #1e3a5f;
            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(0, 183, 255, 0.08);
        }

        /* Heading */
        h1 {
            font-size: 36px;
            margin-bottom: 12px;
            color: #ffffff;
            font-weight: bold;
        }

        /* Blue line under heading */
        h1::after {
            content: "";
            display: block;
            width: 60px;
            height: 4px;
            margin: 12px auto 20px;
            border-radius: 10px;
            background: #00b7ff;
        }

        /* Subtitle */
        .subtitle {
            color: #9fb3c8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Form spacing */
        form {
            margin: 15px 0;
        }

        /* Common Button CSS */
        input[type="submit"] {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 10px;

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        /* Registration Button */
        .register-btn {
            background: #008cff;
            box-shadow: 0 5px 15px rgba(0, 140, 255, 0.25);
        }

        .register-btn:hover {
            background: #00a6ff;
            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 166, 255, 0.35);
        }

        /* Login Button */
        .login-btn {
            background: transparent;
            border: 2px solid #00b7ff !important;
            color: #00b7ff !important;
        }

        .login-btn:hover {
            background: #00b7ff;
            color: white !important;

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 183, 255, 0.25);
        }

        /* Button Click Effect */
        input[type="submit"]:active {
            transform: scale(0.97);
        }

        /* Bottom Text */
        .bottom-text {
            margin-top: 30px;

            color: #647b91;
            font-size: 11px;

            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Responsive */
        @media (max-width: 480px) {

            .container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 14px;
            }

            input[type="submit"] {
                height: 50px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Choose an option below to access your account or register a new one.
        </p>

        <!-- Registration -->
        <form action="{% url 'studentreg' %}" method="post">
            {% csrf_token %}

            <input
                type="submit"
                value="Student Registration"
                class="register-btn"
            >
        </form>

        <!-- Login -->
        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}

            <input
                type="submit"
                value="Login"
                class="login-btn"
            >
        </form>

        <p class="bottom-text">
            Secure • Simple • Fast
        </p>

    </div>

</body>

</html>
