<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #071426,
                #0b1f38,
                #071426
            );

            color: white;
            padding: 20px;
        }

        /* =========================
           LOGIN CARD
        ========================= */

        .login-container {
            width: 100%;
            max-width: 430px;

            padding: 45px 35px;

            background: #0d1b2e;

            border: 1px solid #1e3a5f;
            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(0, 183, 255, 0.08);

            animation: showCard 0.6s ease;
        }


        /* =========================
           HEADING
        ========================= */

        h1 {
            text-align: center;

            font-size: 36px;
            font-weight: bold;

            color: #ffffff;

            margin-bottom: 12px;
        }

        /* Blue Line */

        h1::after {
            content: "";

            display: block;

            width: 60px;
            height: 4px;

            margin: 12px auto 20px;

            border-radius: 10px;

            background: #00b7ff;
        }


        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {
            text-align: center;

            color: #9fb3c8;

            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 32px;
        }


        /* =========================
           FORM
        ========================= */

        form {
            width: 100%;
        }


        /* =========================
           LABEL
        ========================= */

        label {
            display: block;

            margin-bottom: 8px;

            color: #c7d6e5;

            font-size: 14px;
            font-weight: 600;
        }


        /* =========================
           INPUT BOXES
        ========================= */

        input[type="text"],
        input[type="password"] {

            width: 100%;
            height: 52px;

            padding: 0 15px;

            margin-bottom: 20px;

            border: 1px solid #294766;
            border-radius: 10px;

            outline: none;

            background: #091728;

            color: white;

            font-size: 15px;

            transition: 0.3s;
        }


        /* Placeholder */

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #607890;
        }


        /* Input Focus */

        input[type="text"]:focus,
        input[type="password"]:focus {

            border-color: #00b7ff;

            background: #0b1c30;

            box-shadow:
                0 0 0 3px rgba(0, 183, 255, 0.10),
                0 0 15px rgba(0, 183, 255, 0.10);
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        input[type="submit"] {

            width: 100%;
            height: 52px;

            margin-top: 5px;

            border: none;
            border-radius: 10px;

            background: #008cff;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 5px 15px rgba(0, 140, 255, 0.25);
        }


        /* Button Hover */

        input[type="submit"]:hover {

            background: #00a6ff;

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 166, 255, 0.35);
        }


        /* Button Click */

        input[type="submit"]:active {
            transform: scale(0.97);
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .error {

            display: block;

            margin-top: 18px;

            padding: 11px 12px;

            text-align: center;

            border-radius: 8px;

            background: rgba(255, 60, 80, 0.08);

            border: 1px solid rgba(255, 80, 100, 0.25);

            color: #ff7185;

            font-size: 14px;
        }


        /* =========================
           CREATE ACCOUNT
        ========================= */

        .create-account {

            margin-top: 28px;

            padding-top: 22px;

            border-top: 1px solid #1e3a5f;

            text-align: center;

            color: #7f95aa;

            font-size: 14px;
        }


        /* Create Account Link */

        .create-account a {

            display: inline-block;

            margin-top: 9px;

            padding: 10px 20px;

            border: 1px solid #00b7ff;
            border-radius: 8px;

            color: #00b7ff;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s;
        }


        /* Link Hover */

        .create-account a:hover {

            background: #00b7ff;

            color: white;

            box-shadow:
                0 5px 15px rgba(0, 183, 255, 0.25);

            transform: translateY(-2px);
        }


        /* =========================
           CARD ANIMATION
        ========================= */

        @keyframes showCard {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 480px) {

            .login-container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 14px;
            }

            input[type="text"],
            input[type="password"],
            input[type="submit"] {
                height: 50px;
            }
        }

    </style>

</head>


<body>

    <div class="login-container">


        <!-- Heading -->

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to continue to your account
        </p>


        <!-- Login Form -->

        <form action="{% url 'splacement' %}" method="post">

            {% csrf_token %}


            <!-- Username -->

            <label for="username">
                Username
            </label>

            <input
                type="text"
                name="username"
                id="username"
                placeholder="Enter your username"
                required
            >


            <!-- Password -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <!-- Login Button -->

            <input
                type="submit"
                value="Login"
            >


            <!-- Error Message -->

            {% if erg %}

                <span class="error">
                    {{ erg }}
                </span>

            {% endif %}

        </form>


        <!-- Registration -->

        <div class="create-account">

            Don't have an account?

            <br>

            <a href="{% url 'studentreg' %}">
                Create New User
            </a>

        </div>

    </div>

</body>

</html>
