<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;

            font-family: Arial, sans-serif;

            color: white;

            background: linear-gradient(
                135deg,
                #071426,
                #0b1f38,
                #071426
            );
        }


        /* =========================
           REGISTRATION CARD
        ========================= */

        .container {

            width: 100%;
            max-width: 500px;

            padding: 40px 35px;

            background: #0d1b2e;

            border: 1px solid #1e3a5f;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(0, 183, 255, 0.08);

            animation: showCard 0.6s ease;
        }


        /* =========================
           HEADING
        ========================= */

        h1 {

            text-align: center;

            font-size: 36px;

            font-weight: bold;

            color: #ffffff;

            margin-bottom: 12px;
        }


        /* Blue Line */

        h1::after {

            content: "";

            display: block;

            width: 60px;
            height: 4px;

            margin: 12px auto 20px;

            border-radius: 10px;

            background: #00b7ff;
        }


        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {

            text-align: center;

            color: #9fb3c8;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* =========================
           FORM
        ========================= */

        form {

            width: 100%;
        }


        /* =========================
           INPUT GROUP
        ========================= */

        .input-group {

            margin-bottom: 18px;
        }


        /* =========================
           LABEL
        ========================= */

        label {

            display: block;

            margin-bottom: 8px;

            color: #c7d6e5;

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================
           INPUTS
        ========================= */

        input[type="text"],
        input[type="password"],
        input[type="email"] {

            width: 100%;

            height: 50px;

            padding: 0 15px;

            border: 1px solid #294766;

            border-radius: 10px;

            outline: none;

            background: #091728;

            color: white;

            font-size: 15px;

            transition: 0.3s;
        }


        /* Placeholder */

        input::placeholder {

            color: #607890;
        }


        /* =========================
           INPUT FOCUS
        ========================= */

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {

            border-color: #00b7ff;

            background: #0b1c30;

            box-shadow:
                0 0 0 3px rgba(0, 183, 255, 0.10),
                0 0 15px rgba(0, 183, 255, 0.10);
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .error {

            display: block;

            margin-top: 7px;

            padding: 7px 10px;

            border-radius: 6px;

            background: rgba(255, 60, 80, 0.08);

            border-left: 3px solid #ff7185;

            color: #ff7185;

            font-size: 12px;
        }


        /* =========================
           SIGN UP BUTTON
        ========================= */

        .signup-btn {

            width: 100%;

            height: 52px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background: #008cff;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 5px 15px rgba(0, 140, 255, 0.25);
        }


        /* Button Hover */

        .signup-btn:hover {

            background: #00a6ff;

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 166, 255, 0.35);
        }


        /* Button Click */

        .signup-btn:active {

            transform: scale(0.97);
        }


        /* =========================
           BOTTOM TEXT
        ========================= */

        .bottom-text {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #1e3a5f;

            text-align: center;

            color: #647b91;

            font-size: 11px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        /* =========================
           CARD ANIMATION
        ========================= */

        @keyframes showCard {

            from {

                opacity: 0;

                transform: translateY(25px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 550px) {

            body {

                padding: 15px;
            }


            .container {

                padding: 32px 22px;
            }


            h1 {

                font-size: 30px;
            }


            .subtitle {

                font-size: 14px;
            }


            input[type="text"],
            input[type="password"],
            input[type="email"],
            .signup-btn {

                height: 48px;
            }
        }

    </style>

</head>


<body>


    <div class="container">


        <!-- Heading -->

        <h1>
            Student Registration
        </h1>


        <!-- Subtitle -->

        <p class="subtitle">

            Create your student account

        </p>


        <!-- Registration Form -->

        <form action="{% url 'saveuser' %}" method="post">

            {% csrf_token %}


            <!-- Student Name -->

            <div class="input-group">

                <label for="sname">

                    Student Name

                </label>


                <input
                    type="text"
                    name="sname"
                    id="sname"
                    placeholder="Enter your name"
                    required
                >


                {% if errormsg %}

                    <span class="error">

                        {{ errormsg }}

                    </span>

                {% endif %}

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="spassword">

                    Password

                </label>


                <input
                    type="password"
                    name="spassword"
                    id="spassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Student ID -->

            <div class="input-group">

                <label for="sid">

                    Student ID

                </label>


                <input
                    type="text"
                    name="sid"
                    id="sid"
                    placeholder="Enter your student ID"
                    required
                >

            </div>


            <!-- Branch -->

            <div class="input-group">

                <label for="sbranch">

                    Branch

                </label>


                <input
                    type="text"
                    name="sbranch"
                    id="sbranch"
                    placeholder="Enter your branch"
                    required
                >

            </div>


            <!-- Email -->

            <div class="input-group">

                <label for="semail">

                    Email

                </label>


                <input
                    type="email"
                    name="semail"
                    id="semail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Create Account Button -->

            <input
                type="submit"
                value="Create Account"
                class="signup-btn"
            >


        </form>


        <!-- Bottom Text -->

        <div class="bottom-text">

            Student Placement Portal

        </div>


    </div>


</body>

</html>
