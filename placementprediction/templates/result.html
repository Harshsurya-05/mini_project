<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Result</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            color: white;

            background: linear-gradient(
                135deg,
                #071426,
                #0b1f38,
                #071426
            );
        }


        /* =========================
           MAIN RESULT CARD
        ========================= */

        .result-container {

            width: 100%;
            max-width: 550px;

            padding: 45px 35px;

            text-align: center;

            background: #0d1b2e;

            border: 1px solid #1e3a5f;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(0, 183, 255, 0.08);

            animation: showCard 0.6s ease;
        }


        /* =========================
           HEADING
        ========================= */

        h1 {

            font-size: 36px;

            font-weight: bold;

            color: #ffffff;

            margin-bottom: 12px;
        }


        /* Blue Line Under Heading */

        h1::after {

            content: "";

            display: block;

            width: 60px;
            height: 4px;

            margin: 12px auto 28px;

            border-radius: 10px;

            background: #00b7ff;
        }


        /* =========================
           USER VALUE BOX
        ========================= */

        .value-box {

            padding: 20px;

            margin-bottom: 25px;

            border-radius: 10px;

            background: #091728;

            border: 1px solid #294766;

            color: #9fb3c8;

            font-size: 15px;

            line-height: 1.6;
        }


        /* Entered Value */

        .value-box span {

            display: inline-block;

            color: #00b7ff;

            font-size: 18px;

            font-weight: bold;

            word-break: break-word;
        }


        /* =========================
           RESULT BOX
        ========================= */

        .result-box {

            padding: 28px 20px;

            border-radius: 12px;

            background: #091728;

            border: 1px solid #294766;

            transition: 0.3s;
        }


        /* =========================
           SUCCESS RESULT
        ========================= */

        .success {

            border-color: #16a66a;

            background: rgba(22, 166, 106, 0.05);

            box-shadow:
                0 5px 20px rgba(22, 166, 106, 0.08);
        }


        .success h2:first-child {

            color: #2ddc8c;

            font-size: 28px;

            margin-bottom: 14px;
        }


        .success h2:last-child {

            color: #c7d6e5;

            font-size: 19px;

            font-weight: 500;
        }


        /* =========================
           FAILURE RESULT
        ========================= */

        .failure {

            border-color: #b94355;

            background: rgba(185, 67, 85, 0.05);

            box-shadow:
                0 5px 20px rgba(185, 67, 85, 0.08);
        }


        .failure h2:first-child {

            color: #ff7185;

            font-size: 28px;

            margin-bottom: 14px;
        }


        .failure h2:last-child {

            color: #c7d6e5;

            font-size: 19px;

            font-weight: 500;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-btn {

            display: inline-block;

            width: 100%;

            margin-top: 28px;

            padding: 15px 25px;

            border-radius: 10px;

            background: #008cff;

            color: white;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            transition: 0.3s;

            box-shadow:
                0 5px 15px rgba(0, 140, 255, 0.25);
        }


        /* Back Button Hover */

        .back-btn:hover {

            background: #00a6ff;

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 166, 255, 0.35);
        }


        /* Back Button Click */

        .back-btn:active {

            transform: scale(0.97);
        }


        /* =========================
           ANIMATION
        ========================= */

        @keyframes showCard {

            from {

                opacity: 0;

                transform: translateY(25px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .result-container {

                padding: 35px 22px;
            }


            h1 {

                font-size: 30px;
            }


            .success h2:first-child,
            .failure h2:first-child {

                font-size: 24px;
            }


            .success h2:last-child,
            .failure h2:last-child {

                font-size: 17px;
            }


            .value-box {

                font-size: 14px;
            }
        }

    </style>

</head>


<body>


    <div class="result-container">


        <!-- Heading -->

        <h1>
            Placement Result
        </h1>


        <!-- User Entered Values -->

        <div class="value-box">

            The entered value by user:

            <br><br>

            <span>
                {{ lis }}
            </span>

        </div>


        <!-- Placement Result -->

        {% if ans == 1 %}


            <!-- SUCCESS -->

            <div class="result-box success">

                <h2>
                    Congratulations! 🎉
                </h2>

                <h2>
                    Student ko placement milegi.
                </h2>

            </div>


        {% else %}


            <!-- FAILURE -->

            <div class="result-box failure">

                <h2>
                    Sorry! 😔
                </h2>

                <h2>
                    Student is not Eligible for placement.
                </h2>

            </div>


        {% endif %}


        <!-- Back Button -->

        <a href="{% url 'login' %}" class="back-btn">

            Back to Login

        </a>


    </div>


</body>

</html>
